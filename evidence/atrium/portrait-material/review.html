<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>人物面部制作对照</title><style>body{margin:24px;background:#eee9dd;color:#263846;font:16px/1.6 system-ui}main{max-width:1320px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}img{width:100%}select{font:inherit;padding:8px;margin:8px}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>面部材质与眼形 · 制作对照</h1><p>隔离候选，尚未替换游戏模型。眼部覆盖与导出检查不能替代美术验收；身体待机相位未锁定。</p><label>对照<select id="version"><option value="v3">现用模型 / 面部材质</option><option value="v4">材质基线 / 眼形候选</option><option value="normal-ab">有 / 无皮肤法线贴图</option><option value="maps-ab">有 / 无皮肤贴图（诊断）</option><option value="padding-ab">原图集 / 加大边距</option><option value="palette-extension-ab" selected>加大边距 / 完整肤色扩展</option><option value="palette-extension-mobile">移动档肤色扩展</option><option value="v1">首版导出故障（已修复）</option></select></label><label>表情<select id="pose"><option value="neutral">中性</option><option value="closed">闭眼</option><option value="talk">说话</option></select></label><label>视角<select id="angle"><option value="front">正面</option><option value="side">侧面</option></select></label><div class="grid"><figure><figcaption id="left"></figcaption><img id="before" alt="修改前"></figure><figure><figcaption id="right"></figcaption><img id="after" alt="修改后"></figure></div><p id="note"></p></main><script>const [version,pose,angle,before,after,left,right,note]=['version','pose','angle','before','after','left','right','note'].map(id=>document.getElementById(id));const info={v3:['现用模型','材质候选','唇色与区域光泽有小幅改善；颈部贴图细线尚待修复。'],v4:['材质 v3','眼形 v4','眼睛开口增高、虹膜比例调整。闭眼 4964/4964 覆盖，移动模拟自然眨眼通过；面部塑料感仍未解决。'],'normal-ab':['有法线贴图','无法线贴图','颈部细线保留：不能把问题归因于微表面法线。'],'maps-ab':['皮肤贴图','常量材质','移除贴图后细线消失；这是诊断，不是候选外观。'],'padding-ab':['原图集边距','增大边距','测试 UV 岛间隔和烘焙扩展对细线的影响，结论见制作记录。'],'palette-extension-ab':['边距候选 v5','肤色扩展 v7','观察到颈部与耳部暗边消除；面部体积、眉眼衔接和闭眼纹理仍待制作，尚未接入游戏。'],'palette-extension-mobile':['移动边距候选 v5','移动肤色扩展 v7','256px 贴图；桌面 GPU 移动视口模拟，不是真机验收。'],v1:['现用模型','导出故障','多颜色层删除时误删 UV，导致黑色高光表面。本故障已用可重复回归修复；没有接入游戏。']};function show(){let v=version.value,p=pose.value,a=angle.value;before.src=v+'/before-'+p+'-'+a+'.png';after.src=v+'/after-'+p+'-'+a+'.png';left.textContent=info[v][0];right.textContent=info[v][1];note.textContent=info[v][2];}document.querySelectorAll('select').forEach(s=>s.addEventListener('change',show));show();</script></html>
