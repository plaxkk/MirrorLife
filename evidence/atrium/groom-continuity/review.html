<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>主角发流对照</title><style>body{margin:24px;background:#eee9dd;color:#243442;font:16px/1.6 system-ui}main{max-width:1350px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}img{width:100%}select{padding:10px;margin:6px;font:inherit}figure{margin:0}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><h1>主角发流 · 多视角制作对照</h1><p>五版均为隔离研究；游戏内仍使用已验证基线。身体待机相位未锁定，比较重点为发型轮廓、根梢与覆盖。</p><label>版本<select id="version"><option value="v1">v1 连续侧后层 · 否决</option><option value="v2">v2 长发梢 · 否决</option><option value="v3">v3 融合网格 · 否决</option><option value="v4">v4 重排导向 · 耳侧过长</option><option value="v5" selected>v5 随发际线收束 · 仍待制作</option></select></label><label>视角<select id="angle"><option value="back">背面</option><option value="crown">俯视</option><option value="front">正面</option><option value="side">右侧</option><option value="left">左侧</option><option value="body">全身</option></select></label><div class="grid"><figure><figcaption>基线</figcaption><img id="before" alt="基线同镜头"></figure><figure><figcaption>候选</figcaption><img id="after" alt="候选同镜头"></figure></div><p id="note"></p><p>面数合格不代表视觉合格；尚未进行本候选完整动态、真机或用户验收。</p></main><script>const notes={v1:'帽状轮廓与放射纹：否决。',v2:'尖梢过长，顶区平滑底层仍暴露：否决。',v3:'根部接缝变弱，但发束层次被抹平：否决。',v4:'顶区覆盖改善，但耳侧发束越界，未采用。',v5:'顶区覆盖和侧梢有改善，但发根交叠与塑料块感仍明显，未接入游戏。'};function show(){const v=document.querySelector('#version').value,a=document.querySelector('#angle').value;for(const side of ['before','after'])document.querySelector('#'+side).src=v+'/'+side+'-neutral-'+a+'.png';document.querySelector('#note').textContent=notes[v];}document.querySelectorAll('select').forEach(s=>s.addEventListener('change',show));show();</script></html>
