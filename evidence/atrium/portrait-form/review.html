<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>完整面部造型对照</title><style>body{margin:24px;background:#eee9dd;color:#263846;font:16px/1.6 system-ui}main{max-width:1320px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}img{width:100%}select{font:inherit;padding:8px;margin:8px}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>眼部层次与完整面部比例</h1><p>隔离样稿，未替换游戏模型。左侧为 skin-ao-v1，右侧为完整面部造型候选。整体面部人偶感仍未解决。</p><label>版本<select id="version"><option value="v2" selected>平缓鼻侧过渡</option><option value="v1">首版（鼻侧偏硬）</option></select></label><label>表情<select id="pose"><option value="neutral">中性</option><option value="half-blink">半闭眼</option><option value="closed">闭眼</option><option value="talk">说话</option></select></label><label>视角<select id="angle"><option value="front">正面</option><option value="side">侧面</option><option value="quarter">四分之三（中性）</option><option value="body">全身（中性）</option></select></label><div class="grid"><figure><figcaption>材质与眼形基线</figcaption><img id="before" alt="修改前"></figure><figure><figcaption>面部造型候选</figcaption><img id="after" alt="修改后"></figure></div><p>移动档为桌面 GPU 视口模拟。固定表情和局部截图不能证明全角色、连续动作、性能或真机验收。</p></main><script>const [version,pose,angle,before,after]=['version','pose','angle','before','after'].map(id=>document.getElementById(id));function show(){if(["quarter","body"].includes(angle.value))pose.value="neutral";for(const [img,phase]of [[before,'before'],[after,'after']])img.src=version.value+'/'+phase+'-'+pose.value+'-'+angle.value+'.png';}document.querySelectorAll('select').forEach(s=>s.addEventListener('change',show));show();</script></html>
