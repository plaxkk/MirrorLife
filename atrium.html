<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#213646"><title>天井生活馆 · MirrorLife</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23233646'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23eab847' stroke-width='8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/src/atrium.css">
</head>
<body>
  <canvas id="world" aria-label="天井生活馆，使用方向键或 WASD 移动，拖动视角" tabindex="0"></canvas>
  <header class="topbar">
    <a class="brand" href="/game.html" aria-label="返回镜像人生"><span class="brand-mark">◒</span><span>MIRRORLIFE<small>镜像人生</small></span></a>
    <div class="location"><span class="live-dot"></span><span id="location">天井生活馆 · 一层</span></div>
    <nav><button id="journal-button">探索手记 <span id="journal-count">0</span></button><button id="settings-button" aria-label="操作与画质">☷</button></nav>
  </header>
  <aside class="objective"><span class="eyebrow">今天的小事</span><h1 id="objective-title">一起安排一个夜晚</h1><p id="objective-text">先和两位居民聊聊，再去屋子里走走。</p><div class="progress"><span id="talk-progress">结识 0 / 2</span><i></i><span id="find-progress">发现 0 / 2</span></div></aside>
  <div id="resident-labels" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <button id="interaction" hidden><kbd>E</kbd><span id="interaction-text"></span><span class="interaction-arrow">↗</span></button>
  <footer class="controls"><span><kbd>W A S D</kbd> 行走</span><span><kbd>拖动</kbd> 环顾</span><span><kbd>滚轮</kbd> 远近</span><span><kbd>E</kbd> 交谈 / 使用</span><span class="scene-note">午后 · 有人在等你</span></footer>
  <div id="joystick" aria-label="移动摇杆"><div></div></div>
  <button id="mobile-interact" aria-label="交互">交谈</button>
  <section id="dialogue" role="dialog" aria-modal="true" aria-labelledby="dialogue-title" hidden>
    <div class="speaker-line"><span class="speaker-avatar" id="speaker-avatar">林</span><div><h2 id="dialogue-title"></h2><span id="dialogue-meta"></span></div><button id="dialogue-close" aria-label="结束对话">×</button></div>
    <p id="dialogue-text"></p><div id="dialogue-choices"></div>
  </section>
  <section id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden><button id="drawer-close" aria-label="关闭">×</button><span class="eyebrow">MIRRORLIFE / 生活里的片刻</span><h2 id="drawer-title">探索手记</h2><div id="drawer-body"></div></section>
  <section id="loading"><div class="load-card"><span class="eyebrow">MIRRORLIFE · 可探索室内试点</span><div class="load-ring"></div><h1>天井生活馆</h1><p id="loading-text">正在打开一段午后的生活…</p><progress id="loading-progress" max="100" value="0"></progress><button id="enter" hidden>走进生活馆 <span>↗</span></button><button id="retry" hidden>重新加载</button><a href="/game.html">返回城市</a></div></section>
  <script src="/storage.js"></script>
  <script type="module" src="/src/atrium-main.js"></script>
</body>
</html>
